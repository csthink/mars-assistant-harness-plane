name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# 两个互不依赖的 job 并行运行，job verify 汇总它们的结论。
# apps/harness/requirements.lock 只登记了 CPython 3.12 macOS arm64 的 rpds-py wheel 散列，
# Runtime 开发 bundle 的固定解释器资产也是 aarch64-apple-darwin，所以两个 job 都用 macOS arm64 runner。
# 不设置 HARNESS_INSTANCE_ROOT 与 HARNESS_INSTANCE_RECORDS：依赖产品线仓实例区的用例以明确原因 skip。
jobs:
  conformance:
    name: Product tests and Runtime Contract conformance
    runs-on: macos-26
    timeout-minutes: 150
    env:
      PY: apps/harness/.venv/bin/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up CPython 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          python -m venv apps/harness/.venv
          "$PY" -m pip install --disable-pip-version-check --require-hashes -r apps/harness/requirements.lock

      # test_bundle 需要显式给出构建输入与 OpenSSL 3；构建器本身从不下载，这里按固定摘要下载并核对。
      - name: Prepare Runtime development bundle inputs
        run: |
          inputs="$RUNNER_TEMP/bundle-inputs"
          mkdir -p "$inputs"
          "$PY" -B - "$inputs" <<'PYCODE'
          import hashlib
          import json
          import sys
          import urllib.request
          from pathlib import Path

          inputs = Path(sys.argv[1])
          interpreter = json.loads(Path("apps/harness/bundle/inputs.lock.json").read_text())["interpreter"]
          target = inputs / "python-build-standalone" / interpreter["releaseTag"] / interpreter["asset"]
          target.parent.mkdir(parents=True, exist_ok=True)
          with urllib.request.urlopen(interpreter["url"]) as response:
              data = response.read()
          if len(data) != interpreter["bytes"] or hashlib.sha256(data).hexdigest() != interpreter["sha256"]:
              raise SystemExit("interpreter asset does not match apps/harness/bundle/inputs.lock.json")
          target.write_bytes(data)
          PYCODE
          "$PY" -m pip download --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: \
            -r apps/harness/requirements.lock -d "$inputs/wheels"
          openssl_program="$(brew --prefix openssl@3)/bin/openssl"
          "$openssl_program" version | grep -q '^OpenSSL 3\.'
          echo "HP_BUNDLE_INPUTS_DIR=$inputs" >> "$GITHUB_ENV"
          echo "HP_BUNDLE_OPENSSL=$openssl_program" >> "$GITHUB_ENV"

      # 符合性报告的运行器先把 apps/harness 放进 sys.path 再发现用例。这里按 README 所列 unittest 命令的
      # 导入条件（只有仓根与 apps/harness/tests）单独加载一遍，确认每个测试模块不依赖运行器预置的路径也能导入。
      - name: Product test discovery
        run: |
          "$PY" -B - <<'PYCODE'
          import sys
          import unittest

          loader = unittest.TestLoader()
          suite = loader.discover("apps/harness/tests", pattern="test_*.py")
          for error in loader.errors:
              print(error, file=sys.stderr)
          if loader.errors:
              raise SystemExit("product test discovery failed")
          print("discovered", suite.countTestCases(), "product tests")
          PYCODE

      # 产品测试由符合性报告运行：它运行与 README 所列 unittest 命令相同的发现范围（apps/harness/tests 下的
      # test_*.py），任一用例失败、出错或意外通过都使报告 passed 为 false 并以非零退出；另外逐帧核对 Runtime
      # 发出的协议帧。--stream-log 把逐条用例的结果与失败详情同时写到本步骤的日志。报告只留在 runner 临时
      # 目录，不上传。
      # test_bundle 中安装或启动 bundle 的用例要求宿主 macOS 不低于 bundle manifest 的 minimumOs
      # （apps/harness/bundle/manifest.py 的 MINIMUM_OS），与接收方准入的判定相同。runner 镜像低于它时，
      # 这些用例以 "host macOS <版本> is below the bundle minimumOs <版本>" 为原因 skip，其余用例照常运行；
      # 这部分覆盖只在满足该版本的机器上取得，由维护者在本机运行完整套件并留存验证记录。
      - name: Product tests and Runtime Contract conformance report
        run: |
          "$PY" -B apps/harness/tests/run_contract_conformance.py --stream-log --output "$RUNNER_TEMP/conformance"

  checks:
    name: Public safety scan and mechanism selftests
    runs-on: macos-26
    timeout-minutes: 150
    env:
      PY: apps/harness/.venv/bin/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 与 pre-commit hook 是同一个文件。先跑阳性对照，扫描器失效时不会给出假的通过。
      - name: Public safety scanner selftest
        run: bash tools/check-public-safety-generic.sh --selftest

      - name: Scan tracked content
        run: bash tools/check-public-safety-generic.sh .

      - name: Set up CPython 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          python -m venv apps/harness/.venv
          "$PY" -m pip install --disable-pip-version-check --require-hashes -r apps/harness/requirements.lock

      - name: Mechanism selftests
        run: |
          failed=()
          run() {
            local name="$1"
            shift
            echo "::group::$name"
            if "$@"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              failed+=("$name")
            fi
          }
          run artifact-templates "$PY" -B mechanisms/artifact-templates/artifact_lint_selftest.py
          run delivery-method "$PY" -B mechanisms/delivery-method/run_delivery_method_reminder_selftest.py
          run gates "$PY" -B mechanisms/gates/gates.py selftest
          run handoff-protocol "$PY" -B mechanisms/handoff-protocol/handoff_selftest.py
          run handoff-protocol-cl56 "$PY" -B mechanisms/handoff-protocol/handoff_cl56_selftest.py
          run handoff-protocol-workflow "$PY" -B mechanisms/handoff-protocol/handoff_workflow_selftest.py
          run repo-layout "$PY" -B mechanisms/repo-layout/history_read_selftest.py
          # 评审通道只接受净化启动：-B -E -s -S 与已存在的 pycache_prefix 目录。
          run review-channel "$PY" -B -E -s -S -X pycache_prefix="$(mktemp -d)" mechanisms/review-channel/review_channel.py selftest
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::selftest failed: ${failed[*]}"
            exit 1
          fi

  verify:
    # 这个 name 是 main 分支 ruleset 的必需状态检查名，改名须同时改 ruleset；其他 job 不得使用这个名字。
    # if: always() 让它在被依赖的 job 失败或取消时仍然运行并判红：被跳过的必需检查会被当作通过。
    name: verify
    needs: [conformance, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! printf '%s' "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null; then
            echo "::error::a required job did not succeed"
            exit 1
          fi
